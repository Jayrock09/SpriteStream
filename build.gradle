plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Machine-specific settings (e.g. irisJar) live in local.properties, which is not committed.
def localProperties = new Properties()
if (file("local.properties").exists()) {
	file("local.properties").withInputStream { localProperties.load(it) }
}
def irisJar = (project.findProperty("irisJar") ?: localProperties.getProperty("irisJar"))?.toString()?.trim() ?: null

sourceSets {
	main {
		java {
			if (irisJar == null) {
				exclude "dev/spritestream/mixin/iris/**"
			}
		}
	}
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/spritestream.accesswidener")

	runs {
		client {
			// gradlew runClient -PtestWorld="Optimum Realism Test Map" jumps straight into a world in run/saves
			if (project.hasProperty("testWorld")) {
				programArgs "--quickPlaySingleplayer", project.property("testWorld").toString(), "--width", "1920", "--height", "1080"
				vmArg "-Dspritestream.test=true"
			}
			// gradlew runClient -Pbench=<label> runs the benchmark (see Benchmark, tools/bench.sh) in run/saves/SS Bench
			if (project.hasProperty("bench")) {
				// Jayden plays at 2560x1440; -PbenchSize=1920x1080 for a smaller window
				def size = (project.findProperty("benchSize") ?: "2560x1440").toString().split("x")
				programArgs "--quickPlaySingleplayer", "SS Bench", "--width", size[0], "--height", size[1]
				vmArg "-Dspritestream.bench=" + project.property("bench")
				vmArg "-Xmx4096m"
				if (project.hasProperty("benchSpots")) {
					vmArg "-Dspritestream.benchSpots=" + project.property("benchSpots")
				}
				if (project.hasProperty("benchMeasure")) {
					vmArg "-Dspritestream.benchMeasure=" + project.property("benchMeasure")
				}
				if (project.hasProperty("benchWarmup")) {
					vmArg "-Dspritestream.benchWarmup=" + project.property("benchWarmup")
				}
			}
			// gradlew runClient -PssDebug=aniso1,coloronly turns on debug switches (see SpriteStreamMod.DEBUG)
			if (project.hasProperty("ssDebug")) {
				vmArg "-Dspritestream.debug=" + project.property("ssDebug")
			}
			// gradlew runClient -Pbaseline measures the game without SpriteStream touching any atlas
			if (project.hasProperty("baseline")) {
				vmArg "-Dspritestream.disabled=true"
			}
		}
	}
}

configurations {
	// Iris 1.11.7, compile-check only (never on the runtime classpath or in the jar)
	iris111
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium owns terrain rendering; we patch its shaders and bind our resources.
	compileOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
	runtimeOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
	iris111("maven.modrinth:iris:${project.iris111_version}") { transitive = false }
	// ShaderPatchTest patches Sodium's real terrain shader.
	testRuntimeOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }

	// Iris shader-pack support targets Iris 1.12, which is not on Modrinth yet. Point irisJar (in
	// local.properties or -PirisJar=...) at a 1.12 jar to build it; without one the Iris hooks are left out.
	if (irisJar != null) {
		compileOnly files(irisJar)
		// IrisHookCheckTest checks the hooks against this jar's class files.
		testRuntimeOnly files(irisJar)
		// gradlew runClient -Piris adds Iris so shader-pack (PBR/POM) streaming can be tested
		if (project.hasProperty("iris")) {
			runtimeOnly files(irisJar)
		}
	}
	// Test client only: connected/random textures (OptiFine CTM format), used by packs like Optimum Realism.
	runtimeOnly("maven.modrinth:continuity:${project.continuity_version}") { transitive = false }
	// Test client only: skips the "experimental settings" warning so quick-play never stalls on it.
	runtimeOnly("maven.modrinth:yeetus-experimentus:aSzA9PLW") { transitive = false }

	// Unit tests for the pure logic (CTM parsing, pool math, config, shader text patching).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// IrisHookCheckTest/IrisCompatTest read both Iris jars directly to check each hook set.
	systemProperty "spritestream.iris111Jar", configurations.iris111.singleFile.absolutePath
	systemProperty "spritestream.testTmp", layout.buildDirectory.dir("tmp/iris-nested").get().asFile.absolutePath
	if (irisJar != null) {
		systemProperty "spritestream.iris112Jar", file(irisJar).absolutePath
	}
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// LGPL: ship the license texts with the binary.
	from(files("COPYING", "COPYING.LESSER")) {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// Compiles the Iris hooks (except the 1.12-only sampler hook) and everything they use against Iris 1.11.7, so
// a 1.11 API mismatch fails the build instead of the game. Runs with `gradlew check` / `build`.
def compileAgainstIris111 = tasks.register("compileAgainstIris111", JavaCompile) {
	source = sourceSets.main.java
	exclude "dev/spritestream/mixin/iris/IrisSamplersMixin.java"
	classpath = sourceSets.main.compileClasspath.filter { irisJar == null || it != file(irisJar) } + configurations.iris111
	destinationDirectory = layout.buildDirectory.dir("iris111-check")
	options.release = 25
	options.encoding = "UTF-8"
}
tasks.named("check") { dependsOn compileAgainstIris111 }
